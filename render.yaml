databases:
  - name: payroll-db
    plan: free
    databaseName: payroll
    user: payroll

services:
  - type: web
    name: payroll
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /login
    envVars:
      - key: APP_NAME
        value: "Payroll - Majma al Markazi"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # generateValue: true does NOT work here - it produces a plain random
      # string, not the base64: 32-byte key Laravel's encrypter requires, and
      # every request needing session/cookie encryption throws. Set this by
      # hand in the Render dashboard (Environment tab) instead - not
      # committed here, since it's a real encryption secret and this repo
      # may end up public.
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://payroll.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: "5432"
      - key: DB_URL
        fromDatabase:
          name: payroll-db
          property: connectionString
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: LOG_CHANNEL
        value: stderr
      - key: AIIMS_DRIVER
        value: mock
      - key: FINANCIAL_ERP_DRIVER
        value: mock
